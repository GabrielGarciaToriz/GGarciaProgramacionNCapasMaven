<nav xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
    th:fragment="mainNav" class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold"
            sec:authorize="hasAnyAuthority('ADMIN','ROLE_ADMIN','Administrador','GERENTE','ROLE_GERENTE','Gerente')"
            th:href="@{/usuario}">Sistema Usuarios</a>
        <a class="navbar-brand fw-semibold"
            sec:authorize="!hasAnyAuthority('ADMIN','ROLE_ADMIN','Administrador','GERENTE','ROLE_GERENTE','Gerente') and isAuthenticated()"
            th:href="@{/usuario/mi-perfil}">Sistema Usuarios</a>
        <a class="navbar-brand fw-semibold" sec:authorize="isAnonymous()" th:href="@{/login}">Sistema Usuarios</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
            aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0" sec:authorize="isAuthenticated()">
                <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN','ROLE_ADMIN','Administrador','GERENTE','ROLE_GERENTE','Gerente')">
                    <a class="nav-link" th:href="@{/usuario}">Directorio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/usuario/mi-perfil}">Mi perfil</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN','ROLE_ADMIN','Administrador')">
                    <a class="nav-link" th:href="@{/usuario/cargar}">Carga masiva</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN','ROLE_ADMIN','Administrador','GERENTE','ROLE_GERENTE','Gerente')">
                    <a class="nav-link" th:href="@{/usuario/form}">Nuevo usuario</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <span class="text-white small">
                    Bienvenido, <strong sec:authentication="name"></strong>
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm rounded-pill px-3">Cerrar sesion</button>
                </form>
            </div>

            <div class="d-flex align-items-center gap-2" sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn btn-outline-light btn-sm rounded-pill px-3">Iniciar sesion</a>
                <a th:href="@{/usuario/form}" class="btn btn-light btn-sm rounded-pill px-3">Registrarse</a>
            </div>
        </div>
    </div>
</nav>
