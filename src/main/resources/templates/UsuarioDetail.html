<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <th:block th:replace="~{components/head :: recursos}"></th:block>
    <script type="module" th:src="@{/js/main.js}"></script>
    <title>Perfil de usuario</title>

</head>

<body class="bg-light py-5">
    <div class="container">
        <a th:href="@{/usuario}" class="btn btn-warning mb-4"><i class="bi bi-arrow-return-left"></i> Regresar</a>

        <div class="card shadow-sm rounded-custom border-0 overflow-hidden">
            <div class="card-body p-4">
                <div class="row g-4">
                    <div class="col-12 col-lg-4">
                        <div class="card h-100 border-light bg-light rounded-custom">
                            <div class="card-body text-center">
                                <div class="profile-img-container shadow-sm mb-3">
                                    <i class="bi bi-person display-4"></i>
                                </div>
                                <h4 class="card-title mb-1">
                                    <span th:text="${usuario.Nombre}"></span>
                                    <span th:text="${usuario.ApellidoPaterno}"></span>
                                    <span th:text="${usuario.ApellidoMaterno}"></span>
                                </h4>
                                <p class="text-muted mb-4" th:text="${usuario.Rol.Nombre}"></p>

                                <ul class="list-group list-group-flush text-start rounded-3 mb-4">
                                    <li
                                        class="list-group-item d-flex flex-wrap justify-content-between align-items-center bg-transparent gap-2">
                                        <strong>Sexo:</strong>
                                        <span class="text-secondary text-end" th:text="${usuario.Sexo}"></span>
                                    </li>
                                    <li
                                        class="list-group-item d-flex flex-wrap justify-content-between align-items-center bg-transparent gap-2">
                                        <strong>CURP:</strong>
                                        <span class="text-secondary text-end text-break"
                                            th:text="${usuario.Curp}"></span>
                                    </li>
                                    <li
                                        class="list-group-item d-flex flex-wrap justify-content-between align-items-center bg-transparent gap-2">
                                        <strong>Celular:</strong>
                                        <span class="text-secondary text-end" th:text="${usuario.Celular}"></span>
                                    </li>
                                    <li
                                        class="list-group-item d-flex flex-wrap justify-content-between align-items-center bg-transparent gap-2">
                                        <strong>Teléfono:</strong>
                                        <span class="text-secondary text-end" th:text="${usuario.Telefono}"></span>
                                    </li>
                                    <li
                                        class="list-group-item d-flex flex-wrap justify-content-between align-items-center bg-transparent gap-2">
                                        <strong>Correo:</strong>
                                        <span class="text-secondary text-end text-break"
                                            th:text="${usuario.Email}"></span>
                                    </li>
                                    <li
                                        class="list-group-item d-flex flex-wrap justify-content-between align-items-center bg-transparent gap-2">
                                        <strong>Nacimiento:</strong>
                                        <span class="text-secondary text-end"
                                            th:text="${usuario.FechaNacimiento}"></span>
                                    </li>
                                </ul>

                                <button class="btn btn-primary w-100 rounded-pill" data-bs-toggle="modal"
                                    data-bs-target="#ModalEditarPerfil">
                                    <i class="bi bi-pencil-square me-2"></i>Editar Perfil
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-lg-8">
                        <div class="card h-100 border-light rounded-custom">
                            <div
                                class="card-header bg-white border-0 d-flex flex-wrap justify-content-between align-items-center gap-2">
                                <h5 class="mb-0">Mis Direcciones</h5>

                                <div class="d-flex gap-2">
                                    <button type="button" class="btn btn-sm btn-outline-success rounded-pill">
                                        <i class="bi bi-plus-lg"></i> Nueva
                                    </button>
                                </div>
                            </div>

                            <div class="card-body">
                                <div class="list-group list-group-flush">
                                    <div class="list-group-item p-3 border rounded-3 mb-3 shadow-sm"
                                        th:each="direccion : ${usuario.direcciones}">
                                        <div class="row align-items-center g-3">
                                            <div class="col-12 col-md-8">
                                                <p class="text-muted small mb-0 text-break"
                                                    th:text="|${direccion.Calle} #${direccion.NumeroExterior} ${direccion.NumeroInterior}, Col. ${direccion.Colonia.Nombre}, ${direccion.Colonia.Municipio.Nombre}, ${direccion.Colonia.Municipio.Estado.Nombre}, ${direccion.Colonia.Municipio.Estado.Pais.Nombre}|">
                                                </p>
                                            </div>
                                            <div class="col-12 col-md-4 text-md-end text-start">
                                                <div class="btn-group" role="group">
                                                    <a th:href="@{/usuario/detail/{IdDireccion}(IdDireccion=${direccion.IdDireccion})}"
                                                        class="btn btn-outline-secondary btn-sm">
                                                        <i class="bi bi-pencil"></i>
                                                    </a>
                                                    <button type="button" class="btn btn-outline-danger btn-sm"
                                                        onclick="confirm('¿Eliminar?')">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="ModalEditarPerfil">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header">
                    <h4 class="modal-title">Editar Perfil</h4>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <!-- Modal body -->
                <div class="modal-body">
                    <form action="#" method="post" th:object="${usuario}">
                        <h5 class="form-section-title mt-0"><i class="bi bi-shield-lock me-2"></i>Datos de la Cuenta
                        </h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label for="UserName" class="form-label">Usuario</label>
                                <input type="text" class="form-control validar-usuario validar-usuario-blur"
                                    id="UserName" placeholder="Ej. user123" required th:field="*{UserName}" />
                                <span id="errorUserName" class="text-danger small"></span>
                            </div>
                            <div class="col-md-4">
                                <label for="Email" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control validar-correo validar-correo-blur" id="Email"
                                    placeholder="ejemplo@dominio.com" th:field="*{Email}" required />
                                <span id="errorEmail" class="text-danger small"></span>
                            </div>
                            <div class="col-md-4">
                                <label for="Rol" class="form-label">Rol del Sistema</label>
                                <option value="0">Seleccione una opción</option>
                                <option th:each="roles : ${roles}" th:value="${roles.IdRol}" th:text="${roles.Nombre}">
                                </option>
                            </div>
                        </div>

                        <h5 class="form-section-title"><i class="bi bi-person-lines-fill me-2"></i>Información Personal
                        </h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-4">
                                <label for="Nombre" class="form-label">Nombre(s)</label>
                                <input type="text" class="form-control validar-letras validar-letras-blur" id="Nombre"
                                    placeholder="Ej. Gabriel" th:field="*{Nombre}" required />
                                <span id="errorNombre" class="text-danger small"></span>
                            </div>
                            <div class="col-md-4">
                                <label for="ApellidoPaterno" class="form-label">Apellido Paterno</label>
                                <input type="text" class="form-control validar-letras validar-letras-blur"
                                    id="ApellidoPaterno" placeholder="Ej. García" th:field="*{ApellidoPaterno}"
                                    required />
                                <span id="errorApellidoPaterno" class="text-danger small"></span>
                            </div>
                            <div class="col-md-4">
                                <label for="ApellidoMaterno" class="form-label">Apellido Materno</label>
                                <input type="text" class="form-control validar-letras validar-letras-blur"
                                    id="ApellidoMaterno" placeholder="Ej. Toríz" th:field="*{ApellidoMaterno}"
                                    required />
                                <span id="errorApellidoMaterno" class="text-danger small"></span>
                            </div>

                            <div class="col-md-4">
                                <label for="FechaNacimiento" class="form-label">Fecha de Nacimiento</label>
                                <input type="date" class="form-control solo-calendario abrir-calendario"
                                    id="FechaNacimiento" th:field="*{FechaNacimiento}" required />
                            </div>
                            <div class="col-md-4">
                                <label for="Curp" class="form-label">Clave CURP</label>
                                <input type="text" class="form-control text-uppercase validar-curp validar-curp-blur"
                                    id="Curp" placeholder="Ingrese los 18 caracteres" maxlength="18" th:field="*{Curp}"
                                    required />
                                <span id="errorCurp" class="text-danger small"></span>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label d-block">Sexo</label>
                                <div class="form-check form-check-inline mt-2">
                                    <input type="radio" class="form-check-input" id="rbHombre" name="Sexo"
                                        value="Hombre" />
                                    <label for="rbHombre" class="form-check-label">Hombre</label>
                                </div>
                                <div class="form-check form-check-inline mt-2">
                                    <input type="radio" class="form-check-input" id="rbMujer" name="Sexo"
                                        value="Mujer" />
                                    <label for="rbMujer" class="form-check-label">Mujer</label>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <label for="Celular" class="form-label">Celular</label>
                                <input type="text" class="form-control validar-celular validar-celular-blur"
                                    id="Celular" placeholder="Ej. 5512345678" th:field="*{Celular}" required />
                                <span id="errorCelular" class="text-danger small"></span>
                            </div>
                            <div class="col-md-4">
                                <label for="Telefono" class="form-label">Teléfono Fijo</label>
                                <input type="text" class="form-control validar-telefono validar-telefono-blur"
                                    id="Telefono" placeholder="Ej. 5512345678" th:field="*{Telefono}" required />
                                <span id="errorTelefono" class="text-danger small"></span>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Modal footer -->
            <div class="modal-footer">
                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close</button>
            </div>

        </div>
    </div>
    </div>

</body>

</html>
