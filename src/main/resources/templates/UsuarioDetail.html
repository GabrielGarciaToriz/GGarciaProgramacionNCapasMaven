<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/index.css}" />

</head>

<body class="bg-light py-5">
    <div class="container">
        <a th:href="@{/usuario}" class="btn btn-warning m-4"><i class="bi bi-arrow-return-left"></i></a>
        <div class="card shadow-sm rounded-custom border-0 overflow-hidden">
            <div class="card-body p-4">

                <div class="row g-4">
                    <div class="col-md-4">
                        <div class="card h-100 border-light bg-light rounded-custom">
                            <div class="card-body text-center">
                                <div class="profile-img-container shadow-sm">
                                    <i class="bi bi-person"></i>
                                </div>

                                <h4 class="card-title mb-1">
                                    <span th:text="${usuario.Nombre}"></span>
                                    <span th:text="${usuario.ApellidoPaterno}"></span>
                                    <span th:text="${usuario.ApellidoMaterno}"></span>
                                </h4>
                                <p class="text-muted mb-4" th:text="${usuario.Rol.Nombre}"></p>

                                <ul class=" list-group list-group-flush text-start rounded-3 mb-4">
                                    <li
                                        class="list-group-item d-flex justify-content-between align-items-center bg-transparent">
                                        <strong>Sexo:</strong>
                                        <span class="text-secondary" th:text="${usuario.Sexo}"></span>
                                    </li>
                                    <li
                                        class="list-group-item d-flex justify-content-between align-items-center bg-transparent">
                                        <strong>CURP:</strong>
                                        <span class="text-secondary" th:text="${usuario.Curp}"></span>
                                    </li>
                                    <li
                                        class="list-group-item d-flex justify-content-between align-items-center bg-transparent">
                                        <strong>Celular:</strong>
                                        <span class="text-secondary" th:text="${usuario.Celular}"></span>
                                    </li>
                                    <li
                                        class="list-group-item d-flex justify-content-between align-items-center bg-transparent">
                                        <strong>Telefono:</strong>
                                        <span class="text-secondary" th:text="${usuario.Telefono}"></span>
                                    </li>
                                    <li
                                        class="list-group-item d-flex justify-content-between align-items-center bg-transparent">
                                        <strong>Correo:</strong>
                                        <span class="text-secondary" th:text="${usuario.Email}"></span>
                                    </li>
                                    <li
                                        class="list-group-item d-flex justify-content-between align-items-center bg-transparent">
                                        <strong>Fecha Nacimiento:</strong>
                                        <span class="text-secondary" th:text="${usuario.FechaNacimiento}"></span>
                                    </li>
                                </ul>

                                <a class="btn btn-primary w-100 rounded-pill">
                                    <i class="bi bi-pencil-square me-2"></i>Editar Perfil
                                </a>
                            </div>
                        </div>
                    </div>


                    <div class="col-md-8">
                        <div class="row">
                            <div class="card h-100 border-light rounded-custom">
                                <div
                                    class="card-header bg-white border-0 d-flex justify-content-between align-items-center">
                                    <h5 class="mb-0">Mis Direcciones</h5>
                                    <button type="button" class="btn btn-sm btn-outline-success rounded-pill" data-bs-toggle="modal"
                                        daa-bs-target="modalDireccion">
                                        <i class="bi bi-plus-lg"></i> Nueva
                                    </button>
                                </div>
                                <div class="card-body" th:each="direccion : ${usuario.direcciones}">

                                    <div class="list-group list-group-flush">

                                        <div class="list-group-item p-3 border rounded-3 mb-3 shadow-sm">
                                            <div class="row align-items-center">
                                                <div class="col-md-8 mb-2 mb-md-0">
                                                    <p class="text-muted small mb-0"
                                                        th:text="|${direccion.Calle} #${direccion.NumeroExterior} ${direccion.NumeroInterior}, Col. ${direccion.Colonia.Nombre}, ${direccion.Colonia.Municipio.Nombre}, ${direccion.Colonia.Municipio.Estado.Nombre}, ${direccion.Colonia.Municipio.Estado.Pais.Nombre}|">
                                                    </p>
                                                </div>
                                                <div class="col-md-4 text-end">
                                                    <div class="btn-group" role="group">
                                                        <a href="#" class="btn btn-outline-secondary btn-sm">
                                                            <i class="bi bi-pencil"></i>
                                                        </a>
                                                        <button type="button" class="btn btn-outline-danger btn-sm"
                                                            onclick="confirm('¿Eliminar?')">
                                                            <i class="bi bi-trash"></i>
                                                        </button>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalDireccion" tabindex="-1" aria-labelledby="modalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content rounded-4 shadow">
                <div class="modal-header border-0">
                    <div class="modal-title fw-bold" id="modalLabel">Agregar Direccion</div>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
