<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{components/head :: recursos}"></th:block>
    <title>Iniciar sesión</title>
</head>

<body class="bg-light min-vh-100 d-flex align-items-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card shadow-sm border-0 rounded-4">
                    <div class="card-body p-4">
                        <h4 class="fw-bold text-center mb-2">Acceso al sistema</h4>
                        <p class="text-muted text-center mb-4">Ingresa con tu usuario o correo electrónico.</p>

                        <div th:if="${param.error}" class="alert alert-danger" role="alert">
                            Usuario o contraseña inválidos.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success" role="alert">
                            Sesión cerrada correctamente.
                        </div>

                        <form th:action="@{/login}" method="post" autocomplete="off">
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario o correo</label>
                                <input type="text" id="username" name="username" class="form-control" required autofocus>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" id="password" name="password" class="form-control" required>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary">Entrar</button>
                            </div>
                        </form>

                        <div class="text-center mt-3">
                            <a th:href="@{/usuario/form}" class="small">Crear una cuenta</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
